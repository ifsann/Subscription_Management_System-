{% extends "base.html" %}{% block title %}Join · Brightloop{% endblock %}
{% block bare %}<div class="panel"><h2>Create your account</h2>
<form method="post">
<label>Name<input name="name"></label><br>
<label>Email<input name="email" type="email" required></label><br>
<label>Password<input name="password" type="password" required minlength="9"></label>
<p class="muted">More than 8 characters, with an uppercase letter, a lowercase letter and a special character.</p>
<button>Sign up</button></form>
<p class="muted">Already a member? <a href="{{ url_for('auth.login') }}">Log in</a></p></div>{% endblock %}
